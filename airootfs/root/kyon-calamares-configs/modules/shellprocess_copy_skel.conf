# /etc/calamares/modules/shellprocess_copy_skel.conf
#
# Copy the shipped /etc/skel (the airootfs dotfiles: kitty, zsh, hypr, niri,
# ghostty, ...) into the new user's home as the VERY LAST home-affecting step
# of the install. It runs after shellprocess@default (which syncs the Oh My
# Zsh setup back into /etc/skel) and after shellprocess@dms (the
# dms/noctalia greeter install), so the user's dotfiles are the final state
# of the home and nothing that ran earlier can clobber them.
#
# Keeping this copy in its own step (instead of inside shellprocess@default)
# also means it cannot be skipped when an earlier command in that step (e.g.
# its leading `pacman -Sy`) fails.
---
dontChroot: false
timeout: 120
script:
    # The `-` prefix keeps a failure non-fatal: never abort the install just
    # because the dotfile copy failed.
    - '-runuser ${USER} -c "cp -rf /etc/skel/. /home/${USER}/."'
    # The live ISO ships .xsession/.xprofile/.xinitrc for the root autologin;
    # drop them from the user's home so the installed system boots cleanly.
    - '-runuser ${USER} -c "rm -rf /home/${USER}/{.xsession,.xprofile,.xinitrc}"'
