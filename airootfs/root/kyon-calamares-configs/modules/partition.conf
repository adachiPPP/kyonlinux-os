#
# Partition handling.
#
# This config follows the reference partition.conf shipped with the
# Calamares build this ISO uses (EndeavourOS fork, 3.3.10). The EFI system
# partition is mounted at /boot (works for GRUB, systemd-boot, rEFInd and
# Limine alike), and scripts/install-bootloader installs every bootloader
# into that same /boot ESP.
#
# IMPORTANT: *efiBootLoaderVar* is deliberately NOT set here. This fork's
# partition module (unlike upstream 3.3.10) reads that key in its
# onActivate() and then FORCES the ESP mount point to match the chosen
# bootloader: grub -> /boot/efi, refind -> /boot, anything else (limine,
# systemd-boot) -> /efi. That silently breaks the Kyon layout, where the
# ESP must stay at /boot so the kernels, initramfs and the bootloader all
# live on the one ESP that scripts/install-bootloader writes to. Without
# efiBootLoaderVar the override is skipped and the *efi.mountPoint*
# below is honored. The chosen bootloader still reaches the installer via
# global storage "packagechooser_bootloader" (shellprocess@bootloader
# reads it directly).
---
efi:
    mountPoint:         "/boot"
    recommendedSize:    2048MiB
    minimumSize:        500MiB
    label:              "EFI"

userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition

drawNestedPartitions:   false

alwaysShowPartitionLabels: true

initialPartitioningChoice: none

initialSwapChoice: none

defaultFileSystemType:  "ext4"

# No defaultPartitionTableType is set on purpose: Calamares then picks the
# partition table from the firmware (GPT on UEFI, MBR/msdos on BIOS/CSM).
# BIOS installs on GPT require a BIOS boot partition (bios_grub flag, GPT
# type code EF02), which this Calamares build (3.3.10) never auto-creates
# during 'Erase disk' - forcing GPT made every BIOS install fail at the
# limine/grub step ("no BIOS boot partition specified or detected"). On
# MBR the bootloader embeds in the post-MBR gap and nothing extra is
# needed, so BIOS installs complete. A BIOS install on a manually-created
# GPT disk is still caught (auto-repaired or rejected early) by
# install-bootloader's ensure_bios_boot().

# LUKS1, not LUKS2: GRUB (one of the bootloader chooser options) cannot
# decrypt LUKS2 volumes that use Argon2id, which would leave encrypted
# GRUB installations unbootable. LUKS1 works with GRUB.
luksGeneration: luks1

showNotEncryptedBootMessage:   false

# Filesystems the user may choose from in the partitioning page (the
# defaultFileSystemType is always available).
availableFileSystemTypes:  ["ext4", "btrfs"]

# Simple automatic layout: one root partition using all remaining space.
partitionLayout:
    - name: "kyon"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
