#
# Calamares packages configuration for Kyon Linux
---
backend: pacman

skip_if_no_internet: false
update_db: true
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true

operations:
  - install:
      - neovim
      - mkinitcpio
      - linux
      - linux-headers
      - nix
      - firefox
      - kitty
      - alacritty
      - git
      - fastfetch
      - networkmanager
      - pipewire
      - pipewire-alsa
      - pipewire-pulse
      - wireplumber
      - flatpak
      - opendoas
      - bluez
      - bluez-utils
      - cups
      - avahi
      - dbus
      - firewalld
      # Bootloader tooling: install-bootloader runs INSIDE the chroot after
      # the packages phase, and the chroot cannot see the live ISO's /usr.
      # gptfdisk (sgdisk) + parted repair/verify the GPT (BIOS installs),
      # limine + efibootmgr are what the bootloader step actually installs
      # and registers. Guaranteed here so the bootloader step is never
      # missing a tool.
      - gptfdisk
      - parted
      - limine
      - efibootmgr
      - arch-update
      # Kyon Linux branding/extra (kyonrepo)
      - nya