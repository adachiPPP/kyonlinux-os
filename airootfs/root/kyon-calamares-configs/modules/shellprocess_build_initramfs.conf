#
# Build the initramfs for the installed system.
#
# Why this exists: this Calamares build (EndeavourOS fork 26.03.2.3) does not
# ship the `initcpio` module, and its `initramfs` module is Debian-only
# (update-initramfs). The modified 90-mkinitcpio-install.hook used during the
# install only stages kernels/presets, it never runs mkinitcpio. So this job
# runs `mkinitcpio -P` once, after all kernels are installed and after
# shellprocess@reset_mk_hook removed the disabled hook from the target.
# It must run before the `bootloader` module (grub-mkconfig / limine / etc.
# expect the kernel + initramfs to already be in /boot).
---
dontChroot: false
timeout: 600
script:
    - "mkinitcpio -P"

i18n:
    name: "Building initramfs"
