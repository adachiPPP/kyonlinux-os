---
dontChroot: false
timeout: 3600
script:
    - "pacman -Sy --noconfirm"
    - "-rm /etc/systemd/system/etc-pacman.d-gnupg.mount"
    # The skel -> home copy moved to its own dedicated step
    # (shellprocess@copy_skel), which runs AFTER the dms/noctalia greeter
    # install so the shipped dotfiles are the final state of the home.
    # arch-update ships user units; enable them for all users (services-systemd
    # in this Calamares build cannot enable user units). Failing is non-fatal.
    - '-systemctl --global enable arch-update.timer arch-update-tray.service'
    - command: "bash /etc/calamares/scripts/shell-setup ${USER}"
      verbose: true
    - '-rm /etc/calamares/scripts/shell-setup'
    # The bootloader itself is installed earlier by shellprocess@bootloader
    # (scripts/install-bootloader); nothing to do here anymore.
