#
# handling systemd on target.
---

units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false

   - name: "cups"
     action: "enable"
     mandatory: false

   - name: "avahi-daemon"
     action: "enable"
     mandatory: false

   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false

   - name: "vboxservice"
     action: "enable"
     mandatory: false

   - name: "vmtoolsd"
     action: "enable"
     mandatory: false

   - name: "vmware-vmblock-fuse"
     action: "enable"
     mandatory: false

   - name: "firewalld"
     action: "enable"
     mandatory: false

   - name: "fstrim.timer"
     action: "enable"
     mandatory: false

   - name: "graphical.target"
     action: "set-default"
     mandatory: false

   - name: "dbus.socket"
     action: "enable"
     mandatory: false

   - name:  "pacman-init"
     action: "disable"
     mandatory:  false

   - name: "bluetooth"
     action: "enable"
     mandatory: false

   # NOTE: arch-update.timer / arch-update-tray.service are *user* units;
   # this Calamares build (3.3.x) does not support per-unit `user: true`
   # (schema allows only name/action/mandatory). They are enabled for all
   # users from shellprocess@default via `systemctl --global enable` instead.
