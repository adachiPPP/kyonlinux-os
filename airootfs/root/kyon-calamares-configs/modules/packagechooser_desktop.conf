# SPDX-License-Identifier: CC0-1.0
#
# Desktop chooser (packagechooser module, instance "desktop").
#
# IMPORTANT: this Calamares fork (EndeavourOS 26.03.2.3) does NOT support
# the old `gsName` config key — it was removed in Calamares 3.3.0. Do not
# re-add it. The global-storage key is always derived from the instance id
# in settings.conf: packagechooser@desktop -> "packagechooser_desktop".
#
# method: netinstall-select — the selected item ids are stored in global
# storage under "netinstallSelect" and matched against the group names in
# netinstall.yaml (must match exactly). The netinstall module must appear
# in the exec phase of settings.conf for the groups to be installed.
#
# The empty id "" is the special "no desktop" entry; the ids of the other
# items must match the group *name*s in netinstall.yaml.
---
mode: required

method: netinstall-select

labels:
    step: "Desktop"
    step[tr]: "Masaüstü"

default: "KDE-Desktop"

items:
    - id: ""
      name: "No Desktop"
      name[tr]: "Masaüstü Yok"
      description: "Please pick a desktop environment from the list. If you don't want to install a desktop, that's fine, your system will start up in text-only mode."
      screenshot: ":/images/no-selection.png"

    - id: "Hyprland + DMS"
      name: "Hyprland + DMS"
      description: "Hyprland dynamic tiling Wayland compositor configured with Dank Material Shell. Slick, fast, and modern."
      screenshot: "/etc/calamares/images/hyprland.webp"

    - id: "Niri + DMS"
      name: "Niri + DMS"
      description: "Niri scrollable-tiling Wayland compositor configured with Dank Material Shell. Endless horizontal scrolling."
      screenshot: "/etc/calamares/images/niri.webp"

    - id: "KDE-Desktop"
      name: "Plasma Desktop"
      description: "KDE-Plasma Desktop - Simple by default, powerful when needed."
      screenshot: "/etc/calamares/images/kde.png"

    - id: "GNOME-Desktop"
      name: "GNOME"
      description: "Get things done with ease, comfort, and control."
      screenshot: "/etc/calamares/images/gnome.webp"

    - id: "i3 (x11)"
      name: "i3 (x11)"
      description: "i3 is a lightweight tiling window manager (x11) (might have bugs)"
      screenshot: "/etc/calamares/images/i3.webp"

    - id: "Xfce4 (x11)"
      name: "Xfce4 (x11)"
      description: "Xfce is a lightweight and fast desktop environment. (x11)"
      screenshot: "/etc/calamares/images/xfce.webp"

    - id: "LXQt (x11)"
      name: "LXQt (x11)"
      description: "Lightweight Qt-based desktop environment that keeps resource usage incredibly low (x11)"
      screenshot: "/etc/calamares/images/lxqt.webp"

    - id: "LXDE (x11)"
      name: "LXDE (x11)"
      description: "Classic ultra lightweight GTK desktop environment designed for absolute potato PCs (x11)"
      screenshot: "/etc/calamares/images/lxde.webp"