# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Desktop chooser (packagechooser module, instance "desktop").
#
# This config follows the reference packagechooser.conf shipped with the
# Calamares build this ISO uses (EndeavourOS fork, 3.3.10):
#
#   method: netinstall-add
#
# When the user picks a desktop, the `netinstall:` block of the selected
# item is written to global storage under the key "netinstallAdd". The
# netinstall page (which comes right after this one) then shows that group
# pre-checked, together with the optional groups from netinstall.yaml, and
# hands everything to the packages module for installation.
#
# Notes:
#   - Do NOT add a `gsName` key here: the packagechooser module of this
#     build has no such key (removed upstream in Calamares 3.3.0).
#   - The item *id* values are only used for display/storage; they do NOT
#     need to match netinstall.yaml group names (that matching is only for
#     method: netinstall-select, which we do not use).
#   - `default` must name one of the item ids below.
---
mode: required

method: netinstall-add

labels:
    step: "Desktop"
    step[tr]: "Masaüstü"
    step[ru]: "Рабочий стол"

default: "KDE-Desktop"

items:
    - id: ""
      name: "No Desktop"
      name[tr]: "Masaüstü Yok"
      description: "Please pick a desktop environment from the list. If you don't want to install a desktop, that's fine: your system will start up in text-only mode and you can install a desktop environment later."
      description[tr]: "Lütfen listeden bir masaüstü ortamı seçin. Masaüstü kurmak istemiyorsanız sorun değil: sisteminiz yalnızca metin modunda başlayacak ve daha sonra bir masaüstü ortamı kurabilirsiniz."

    - id: "KDE-Desktop"
      name: "Plasma Desktop"
      description: "KDE-Plasma Desktop - Simple by default, powerful when needed."
      screenshot: "/etc/calamares/images/kde.png"
      netinstall:
        name: "KDE-Desktop"
        description: "KDE-Plasma Desktop - Simple by default, powerful when needed."
        selected: true
        critical: true
        packages:
            - plasma-desktop
            - sddm
            - konsole
            - dolphin
            - plasma-nm
            - plasma-pa
            - kscreen
            - powerdevil
            - bluedevil

    - id: "GNOME-Desktop"
      name: "GNOME"
      description: "Get things done with ease, comfort, and control. ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/gnome.webp"
      netinstall:
        name: "GNOME-Desktop"
        description: "GNOME desktop environment - designed to put you in control."
        selected: true
        critical: true
        packages:
            - gnome-shell
            - gdm
            - gnome-control-center
            - ptyxis
            - nautilus
            - gnome-tweaks
            - gnome-keyring
            - networkmanager
            # Desktop icons (DING) so the GNOME ricing in
            # scripts/desktop-cleanup can show icons on the desktop.
            - gnome-shell-extension-desktop-icons-ng

    - id: "Hyprland + Noctalia"
      name: "Hyprland + Noctalia"
      description: "Hyprland dynamic tiling Wayland compositor configured with Dank Material Shell. Slick, fast, and modern. ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/hyprland.webp"
      netinstall:
        name: "Hyprland + Noctalia"
        description: "Hyprland dynamic tiling Wayland compositor configured with Dank Material Shell."
        selected: true
        critical: true
        packages:
            - hyprland
            - noctalia
            - greetd
            - greetd-regreet
            - quickshell
            - kitty
            - dolphin
            - wayland-protocols
            - xorg-xwayland
            - xdg-desktop-portal-hyprland
            - polkit-kde-agent
            - thunar

    - id: "Niri + DMS"
      name: "Niri + DMS"
      description: "Niri scrollable-tiling Wayland compositor configured with Dank Material Shell. Endless horizontal scrolling. ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/niri.webp"
      netinstall:
        name: "Niri + DMS"
        description: "Niri scrollable-tiling Wayland compositor configured with Dank Material Shell."
        selected: true
        critical: true
        packages:
            - niri
            - dms-shell-git
            - greetd
            - greetd-regreet
            - quickshell
            - kitty
            - wayland-protocols
            - xorg-xwayland
            - xdg-desktop-portal-gnome
            - polkit-gnome
            - thunar

    - id: "i3 (x11)"
      name: "i3 (x11)"
      description: "i3 is a lightweight tiling window manager (x11). ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/i3.webp"
      netinstall:
        name: "i3 (x11)"
        description: "i3 is a lightweight tiling window manager (x11)"
        selected: true
        critical: true
        packages:
            - i3-wm
            - i3blocks
            - i3lock
            - i3status
            - dunst
            - alacritty
            - kitty
            - rofi
            - thunar
            - network-manager-applet
            - xwallpaper
            - sddm
            - xrandr
            - upower
            - gnome-themes-extra

    - id: "Xfce4 (x11)"
      name: "Xfce4 (x11)"
      description: "Xfce is a lightweight and fast desktop environment. (x11) ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/xfce.webp"
      netinstall:
        name: "Xfce4 (x11)"
        description: "Xfce is a lightweight and fast desktop environment. (x11)"
        selected: true
        critical: true
        packages:
            - xfce4
            - xfce4-goodies
            - lightdm
            - lightdm-gtk-greeter
            - xfce4-terminal
            - network-manager-applet
            - thunar-archive-plugin

    - id: "LXQt (x11)"
      name: "LXQt (x11)"
      description: "Lightweight Qt-based desktop environment that keeps resource usage incredibly low (x11) ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/lxqt.webp"
      netinstall:
        name: "LXQt (x11)"
        description: "Lightweight Qt-based desktop environment that keeps resource usage incredibly low (x11)"
        selected: true
        critical: true
        packages:
            - lxqt
            - lxqt-panel
            - pcmanfm-qt
            - sddm

    - id: "LXDE (x11)"
      name: "LXDE (x11)"
      description: "Classic ultra lightweight GTK desktop environment designed for absolute potato PCs (x11) ⚠ unstable / might have issues in this beta."
      screenshot: "/etc/calamares/images/lxde.webp"
      netinstall:
        name: "LXDE (x11)"
        description: "Classic ultra lightweight GTK desktop environment designed for absolute potato PCs (x11)"
        selected: true
        critical: true
        packages:
            - lxde
            - lxde-common
            - pcmanfm
            - sddm

    - id: "Cinnamon (x11)"
      name: "Cinnamon (x11)"
      description: "Cinnamon desktop environment (x11) - modern, comfortable and traditional. ⚠ unstable / might have issues in this beta."
      netinstall:
        name: "Cinnamon (x11)"
        description: "Cinnamon desktop environment (x11)"
        selected: true
        critical: true
        packages:
            - cinnamon
            - nemo
            - gnome-terminal
            - lightdm
            - lightdm-gtk-greeter
            - network-manager-applet

    - id: "MATE (x11)"
      name: "MATE (x11)"
      description: "MATE desktop environment (x11) - continuation of GNOME 2. ⚠ unstable / might have issues in this beta."
      netinstall:
        name: "MATE (x11)"
        description: "MATE desktop environment (x11)"
        selected: true
        critical: true
        packages:
            - mate
            - mate-extra
            - lightdm
            - lightdm-gtk-greeter
            - mate-terminal
            - network-manager-applet

    - id: "Budgie (Wayland)"
      name: "Budgie (Wayland)"
      description: "Budgie desktop environment (Wayland) - sleek and modern. ⚠ unstable / might have issues in this beta."
      netinstall:
        name: "Budgie (Wayland)"
        description: "Budgie desktop environment (Wayland)"
        selected: true
        critical: true
        packages:
            - budgie-desktop
            - nautilus
            - gnome-terminal
            - gdm
            - network-manager-applet
