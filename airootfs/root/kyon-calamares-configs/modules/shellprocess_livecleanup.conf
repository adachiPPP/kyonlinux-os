# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Remove live-ISO-only state that unpackfs copied into the target system.
#
# The target is built by copying the whole live airootfs, which ships
# several things that must NOT survive into an installed system:
#   - /etc/mkinitcpio.conf.d/archiso.conf : archiso hooks (archiso_loop_mnt,
#     archiso_pxe_*) would bake into the installed system's initramfs. This
#     MUST be removed BEFORE shellprocess@build_initramfs runs, otherwise the
#     installed initramfs is built with the live-media hooks. initcpiocfg
#     already wrote a clean /etc/mkinitcpio.conf; this drops the override.
#   - /etc/sddm.conf.d/autologin.conf     : auto-logs in as ROOT on the
#     installed system (security + the wrong user).
#   - /etc/systemd/journald.conf.d/volatile-storage.conf : logs die on every
#     reboot (Storage=volatile).
#   - /etc/systemd/logind.conf.d/do-not-suspend.conf      : suspend/hibernate/
#     lid keys are ignored - laptops could not suspend.
#   - /etc/systemd/resolved.conf.d/archiso.conf           : live mDNS default.
#   - /etc/systemd/networkd.conf.d/...                   : live networkd tweak.
#   - /etc/systemd/system/{choose-mirror,livecd-talk,livecd-alsa-unmuter}
#     .service + their .wants symlinks                   : live-only units.
#
# Every command is prefixed with '-' (non-fatal): missing files must never
# fail the install.
---
dontChroot: false
timeout: 60

script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    # The live system's /etc/mkinitcpio.d/linux.preset is the archiso
    # variant: it references the archiso config file just deleted above
    # (archiso_config=...) and would make mkinitcpio -P fail with
    # "Invalid option -c -- ... must be readable". Replace it with the
    # standard preset, generated from the mkinitcpio package's own
    # hook.preset template (the same way the install hook creates one) -
    # default + fallback images, ALL_config=/etc/mkinitcpio.conf (the
    # clean config initcpiocfg wrote). NOT prefixed with '-' on purpose:
    # this must succeed or the initramfs build will fail.
    - "sed -e 's|%PKGBASE%|linux|g' -e \"s|^#PRESETS=('default' 'fallback')|PRESETS=('default' 'fallback')|\" -e \"/^PRESETS=('default')$/d\" -e 's|^#fallback_image|fallback_image|' -e 's|^#fallback_options|fallback_options|' /usr/share/mkinitcpio/hook.preset > /etc/mkinitcpio.d/linux.preset"
    - "-rm -f /etc/sddm.conf.d/autologin.conf"
    - "-rm -f /etc/systemd/journald.conf.d/volatile-storage.conf"
    - "-rm -f /etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "-rm -f /etc/systemd/resolved.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/networkd.conf.d/ipv6-privacy-extensions.conf"
    - "-rm -f /etc/systemd/system/choose-mirror.service"
    - "-rm -f /etc/systemd/system/livecd-talk.service"
    - "-rm -f /etc/systemd/system/livecd-alsa-unmuter.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service"
    - "-rm -f /etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - "-rm -f /etc/systemd/system/pacman-init.service"
    # Live sshd override (PasswordAuthentication yes + PermitRootLogin yes):
    # would leave root SSH open on the installed system if sshd is enabled.
    - "-rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
    # Installer polkit grant: must not survive into the installed system.
    - "-rm -f /etc/polkit-1/rules.d/49-calamares.rules"

i18n:
    name: "Removing live-environment files from target system"
