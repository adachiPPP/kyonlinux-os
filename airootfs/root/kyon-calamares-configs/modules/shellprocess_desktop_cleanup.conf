#
# Remove the live-ISO Plasma/SDDM leak from the target when a non-KDE desktop
# was chosen, and enable the display manager that belongs to the chosen
# desktop.
#
# WHY this is needed:
#   unpackfs copies the whole live airootfs (which ships Plasma + SDDM for
#   the live autologin session) into the target, so every install inherits
#   the full KDE/Plasma stack regardless of the desktop the user picked - the
#   desktop chooser groups only ADD packages. The live ISO also has SDDM
#   enabled, so SDDM stays the display manager even for Hyprland (greetd),
#   GNOME (gdm) or Xfce (lightdm), whose DM was never enabled.
#
#   This step must run AFTER the `packages` step (the chosen desktop's DM is
#   installed there, and the script detects the choice from what got
#   installed). It fully replaces the stock `displaymanager` module, which is
#   NOT in the sequence: that module crashes for greetd desktops (unguarded
#   `import toml`, python-toml not on the ISO) and for Niri (dereferences a
#   None desktop-environment executable), and its remaining work (service
#   enable, greetd config) is done here and by the shellprocess@dms step.
---
dontChroot: false
timeout: 600

script:
    # ${USER} is expanded by the shellprocess module; the script uses it to
    # apply the per-user GNOME ricing (wallpaper, dark scheme, desktop icons).
    - command: "bash /etc/calamares/scripts/desktop-cleanup ${USER}"
      verbose: true

i18n:
    name: "Configuring display manager for chosen desktop"
