#
# The initcpiocfg module generates /etc/mkinitcpio.conf in the target system
# with the standard hooks (base, udev, autodetect, modconf, kms, keyboard,
# keymap, consolefont, block, filesystems, fsck; plus crypt hooks when the
# root filesystem is LUKS-encrypted, and plymouth when it is installed).
#
# This runs during the exec phase (before the initramfs is built) so that
# the live system's archiso-flavoured mkinitcpio configuration is replaced
# by a clean one for the installed system.
---
# Use the classic (non-systemd) hook set. This keeps the emergency recovery
# shell available and is the most widely compatible choice.
useSystemdHook: false

# No hook modifications for Kyon; the defaults generated by the module are
# correct for an Arch-based installation.
hooks:
    prepend: [ ]
    append: [ ]
    remove: [ ]

# Generate the configuration from scratch, based on the target system.
source: "/etc/mkinitcpio.conf"
