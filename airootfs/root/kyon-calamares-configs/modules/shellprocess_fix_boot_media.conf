#
# Locate the boot media files (airootfs.sfs, vmlinuz-linux) for compatibility
# with Ventoy and Rufus ISO mode.
#
# Standard archiso mounts the boot media at /run/archiso/bootmnt/ and places
# the squashfs at /run/archiso/bootmnt/arch/x86_64/airootfs.sfs.  Ventoy
# and Rufus ISO mode may loop-mount or extract the ISO differently, so the
# standard path may not exist even though the live system booted.
#
# This step runs BEFORE unpackfs: it finds the files wherever they are and
# creates symlinks at the expected paths.
---
dontChroot: true
timeout: 60

script:
    - command: "bash /etc/calamares/scripts/fix-boot-media"
      verbose: true

i18n:
    name: "Locating boot media files"
