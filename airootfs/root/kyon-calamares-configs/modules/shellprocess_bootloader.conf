#
# Installs the chosen bootloader (from packagechooser@bootloader) into the
# target system. Replaces this Calamares build's "grubcfg" + "bootloader"
# modules entirely: the fork's bootloader module has no limine support
# (installs nothing on UEFI, force-installs GRUB on BIOS regardless of the
# choice) and its grub-mkconfig step produces an empty root= inside the
# chroot. The whole flow - grub / limine / systemd-boot / refind, on both
# UEFI and BIOS - is implemented in scripts/install-bootloader following the
# Arch Wiki procedures.
#
# NOTE: Calamares's CommandList expander treats ANY ${...} it does not know
# (including a plain shell variable) as a fatal error ("The commands use
# variables that are not defined"), so this command may contain ONLY the
# registered macros (ROOT, USER, LANG, gs[...]).
---
dontChroot: false
timeout: 600
script:
    - command: "bash /etc/calamares/scripts/install-bootloader \"${gs[packagechooser_bootloader]}\""

i18n:
    name: "Installing bootloader"
