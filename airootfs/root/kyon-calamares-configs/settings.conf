#
# Top-level configuration for Calamares (Kyon Linux).
#
# This is written for the Calamares build that this ISO actually ships:
# the EndeavourOS fork, calamares 26.03.2.3 (based on Calamares 3.3.10),
# installed from the `calamares` package in the [endeavouros] repo.
#
# IMPORTANT: the *release* package in the [endeavouros] repo ships only a
# SUBSET of the fork's modules (no shellprocess / partition / unpackfs /
# users / umount / packages / welcome / summary / services-systemd), so an
# ISO built with it alone cannot run this settings.conf - Calamares fails at
# startup with "Module X not found in module search paths" (the bootloader
# step included). airootfs/root/customize_airootfs.sh therefore installs the
# EndeavourOS full-module build (their "calamares-git" devel package) over
# the release package, exactly like EndeavourOS's own ISO build does.
#
# The reference configs that ship inside that package (in
# /etc/calamares/modules/ of the package, e.g. packagechooser.conf,
# partition.conf, grubcfg.conf, bootloader.conf) are the authoritative
# documentation for the keys this build understands.
#
# IMPORTANT (about the old "gsName" key):
#   - The `packagechooser` module of this build does NOT have a gsName
#     config key (it was removed from the stock module). The global-storage
#     key it writes is always derived from the instance id in `instances`,
#     below: packagechooser@desktop -> "packagechooser_desktop",
#     packagechooser@bootloader -> "packagechooser_bootloader".
#
# Module flow (desktop selection -> installation):
#   show:  packagechooser@desktop writes the chosen desktop's package group
#          to global storage key "netinstallAdd".
#   show:  netinstall reads "netinstallAdd" and shows that group (checked)
#          together with the optional groups from netinstall.yaml.
#   show:  when the user leaves the netinstall page, it writes the checked
#          groups to global storage "packageOperations".
#   exec:  the `packages` module runs "packageOperations" (pacman installs
#          the desktop + optional groups), then its own install list.
#   exec:  shellprocess@build_initramfs runs `mkinitcpio -P` (this build
#          ships no initcpio module and its initramfs module is Debian-only).
#          It must run after packages and before the bootloader install.
#   exec:  shellprocess@bootloader runs scripts/install-bootloader, which
#          replaces this build's "grubcfg" + "bootloader" modules (see
#          shellprocess_bootloader.conf for why).
#
---
modules-search: [ local ]

# Custom module instances. The *id* matters: for the packagechooser module it
# determines the global-storage key that other modules/scripts read
# (packagechooser_<id>).
instances:
  - id:       desktop
    module:   packagechooser
    config:   packagechooser_desktop.conf
  - id:       bootloader
    module:   packagechooser
    config:   packagechooser_bootloader.conf
  - id:       livecleanup
    module:   shellprocess
    config:   shellprocess_livecleanup.conf
  - id:       modify_mk_hook
    module:   shellprocess
    config:   shellprocess_modify_mk_hook.conf
  - id:       initialize_pacman
    module:   shellprocess
    config:   shellprocess_initialize_pacman.conf
  - id:       reset_mk_hook
    module:   shellprocess
    config:   shellprocess_reset_mk_hook.conf
  - id:       build_initramfs
    module:   shellprocess
    config:   shellprocess_build_initramfs.conf
  - id:       bootloader
    module:   shellprocess
    config:   shellprocess_bootloader.conf
  - id:       db
    module:   shellprocess
    config:   shellprocess_db.conf
  - id:       btrfs_snapshot
    module:   shellprocess
    config:   shellprocess_btrfs_snapshot.conf
  - id:       dms
    module:   shellprocess
    config:   shellprocess_dms.conf
  - id:       cleanup_calamares
    module:   shellprocess
    config:   shellprocess_cleanup_calamares.conf
  - id:       default
    module:   shellprocess
    config:   shellprocess.conf

# The installer sequence. This mirrors the reference settings.conf of the
# EndeavourOS fork, adapted for Kyon (packagechooser for desktop + bootloader,
# a netinstall page for optional groups, and shellprocess jobs for the
# things this build has no dedicated module for).
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@bootloader
      - partition
      - packagechooser@desktop
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      # Regenerate a clean /etc/mkinitcpio.conf in the target (the live
      # system's config carries archiso-only hooks).
      - initcpiocfg
      # Drop live-ISO-only files that unpackfs copied into the target (root
      # sddm autologin, volatile journal, logind suspend overrides, archiso
      # mkinitcpio hooks, live-only systemd units). Must run BEFORE
      # build_initramfs so the archiso hooks never enter the initramfs.
      - shellprocess@livecleanup
      # Stage the "don't build initramfs during pacman operations" hook on
      # the host and in the chroot, and prepare pacman (mirrorlist + keyring).
      - shellprocess@modify_mk_hook
      - shellprocess@initialize_pacman
      - users
      - displaymanager
      - networkcfg
      - hwclock
      # Refresh the pacman database, then install packages: the desktop /
      # optional groups collected by the netinstall page (via global storage
      # "packageOperations") and the operations in packages.conf.
      - shellprocess@db
      - packages
      # Enable system services ONLY AFTER the packages phase: several units
      # in services-systemd.conf (cups, avahi-daemon, firewalld, bluetooth)
      # ship in packages that packages.conf installs, so running this module
      # before `packages` made those `systemctl enable` calls fail silently
      # (mandatory: false) and the services stayed off on the installed
      # system.
      - services-systemd
      # Restore the normal mkinitcpio hook and build the initramfs once.
      - shellprocess@reset_mk_hook
      - shellprocess@build_initramfs
      # Install the chosen bootloader (grub / limine / systemd-boot / refind)
      # directly, replacing this build's grubcfg + bootloader modules which
      # cannot install limine and produce an empty root= on GRUB installs.
      - shellprocess@bootloader
      # Post-install: copy /etc/skel, shell setup, snapshots, firewall,
      # greeter and cleanup.
      - shellprocess@default
      - shellprocess@btrfs_snapshot
      - shellprocess@dms
      - shellprocess@cleanup_calamares
      - umount
  - show:
      - finished

# Branding component (directory under /usr/share/calamares/branding).
branding: kyonlinux

# Show an "are you sure?" prompt before the exec phase starts.
prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
