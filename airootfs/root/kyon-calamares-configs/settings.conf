#
# Top-level configuration for Calamares (EndeavourOS-fork / calamares 3.3.x).
# See https://calamares.io/docs/ for the module documentation.
---
# Search order for modules. "local" covers $LIBDIR/calamares/modules,
# SHARE/calamares/modules and /etc/calamares/modules.
modules-search: [ local ]

# Custom module instances. Each entry references a *module* (the name of the
# compiled module) with an *id*; the *config* key selects the config file
# (defaults to <module>.conf). Instance keys are referenced in the sequence
# as module@id.
instances:
  - id:       desktop
    module:   packagechooser
    config:   packagechooser_desktop.conf
  - id:       bootloader
    module:   packagechooser
    config:   packagechooser_bootloader.conf
  - id:       modify_mk_hook
    module:   shellprocess
    config:   shellprocess_modify_mk_hook.conf
  - id:       initialize_pacman
    module:   shellprocess
    config:   shellprocess_initialize_pacman.conf
  - id:       reset_mk_hook
    module:   shellprocess
    config:   shellprocess_reset_mk_hook.conf
  - id:       build_initramfs
    module:   shellprocess
    config:   shellprocess_build_initramfs.conf
  - id:       db
    module:   shellprocess
    config:   shellprocess_db.conf
  - id:       btrfs_snapshot
    module:   shellprocess
    config:   shellprocess_btrfs_snapshot.conf
  - id:       enable_ufw
    module:   shellprocess
    config:   shellprocess_enable_ufw.conf
  - id:       dms
    module:   shellprocess
    config:   shellprocess_dms.conf
  - id:       cleanup_calamares
    module:   shellprocess
    config:   shellprocess_cleanup_calamares.conf
  - id:       default
    module:   shellprocess
    config:   shellprocess.conf

# The sequence of installer pages (show) and jobs (exec).
#
# Notes on the exec phase (these were broken before and silently produced
# systems without a desktop and without an initramfs):
#   - `netinstall` MUST be in exec: it is the module that actually installs
#     the groups selected by the desktop chooser (packagechooser@desktop,
#     method: netinstall-select) and the ones toggled on its page.
#   - `shellprocess@build_initramfs` MUST run after the package installs:
#     the modified 90-mkinitcpio-install.hook only stages kernels and
#     presets, it never builds the initramfs. This job runs `mkinitcpio -P`
#     once (this fork does not ship the `initcpio` module, and its
#     `initramfs` module is Debian-only). It runs before `bootloader` so the
#     bootloader install sees the kernel + initramfs in /boot.
#   - `grubcfg` must run before `bootloader` so grub-mkconfig picks up the
#     /etc/default/grub settings.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@bootloader
      - partition
      - packagechooser@desktop
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - shellprocess@modify_mk_hook
      - shellprocess@initialize_pacman
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - shellprocess@db
      - packages
      - netinstall
      - displaymanager
      - services-systemd
      - shellprocess@reset_mk_hook
      - shellprocess@build_initramfs
      - grubcfg
      - bootloader
      - shellprocess@default
      - shellprocess@btrfs_snapshot
      - shellprocess@enable_ufw
      - shellprocess@dms
      - shellprocess@cleanup_calamares
      - umount
  - show:
      - finished

# Branding component (directory under /usr/share/calamares/branding or
# /etc/calamares/branding).
branding: kyonlinux

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
