# window border
window.active.border.color: #676ee4
window.inactive.border.color: #925cd6

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #fd4663

# window titlebar background
window.active.title.bg.color: #676ee4
window.inactive.title.bg.color: #925cd6

window.active.label.text.color: #0d0e1a
window.inactive.label.text.color: #070712
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #191b43

# window buttons
window.active.button.unpressed.image.color: #0d0e1a
window.inactive.button.unpressed.image.color: #0d0e1a

# menu
menu.border.color: #0d0e1a
menu.items.bg.color: #676ee4
menu.items.text.color: #0d0e1a
menu.items.active.bg.color: #925cd6
menu.items.active.text.color: #070712
menu.separator.color: #0d0e1a
menu.title.bg.color: #676ee4
menu.title.text.color: #0d0e1a

# on screen display (window-cycle dialog)
osd.bg.color: #676ee4
osd.border.color: #0d0e1a
osd.label.text.color: #0d0e1a
osd.window-switcher.preview.border.color: #606270
